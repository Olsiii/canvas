name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M2.1: apps/api's router now imports the BullMQ image queue at
      # module load (trpc/routers/image-asset.ts -> queues/image-queue.ts),
      # which opens a Redis connection as an import-time side effect — so
      # even `apps/api`'s vitest suite touches Redis now, not just the
      # worker process. Without this, ioredis retries in the background and
      # dumps ECONNREFUSED noise into CI logs (tests still pass — nothing
      # here actually calls the queue yet — but the noise is worth avoiding
      # by matching what docker-compose.yml already provisions locally).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://canvas:canvas@localhost:5432/canvas
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - name: Drizzle schema drift check
        run: |
          pnpm db:generate
          git diff --exit-code --stat -- packages/db/drizzle

      - name: Apply migrations to a clean database
        run: pnpm db:migrate

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M2.1: the API server the Playwright webServer boots now imports the
      # BullMQ queue module at startup too — see the `ci` job's redis
      # service comment above for why.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://canvas:canvas@localhost:5432/canvas
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      # Plain `docker run`, not a `services:` container: GitHub Actions'
      # services block has no way to override a container's command, and
      # the official minio/minio image (same one docker-compose.yml uses
      # locally) needs `server /data` passed explicitly — it doesn't run a
      # server by default. Bucket creation is handled by the app itself
      # (storage.ts's ensureBucketExists(), called on both api and worker
      # startup), so no bucket-provisioning env var is needed here either.
      # Was previously bitnami/minio:latest specifically because its image
      # *did* default to running the server — but Bitnami retired free
      # Docker Hub images in 2025, so that tag stopped resolving and this
      # job's containers failed to even initialize. See PROGRESS.md.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=canvas \
            -e MINIO_ROOT_PASSWORD=canvas12345 \
            minio/minio:latest server /data --console-address ":9001"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - name: Wait for MinIO
        run: until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      - run: pnpm --filter @canvas/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @canvas/e2e test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
