name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://canvas:canvas@localhost:5432/canvas

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - name: Drizzle schema drift check
        run: |
          pnpm db:generate
          git diff --exit-code --stat -- packages/db/drizzle

      - name: Apply migrations to a clean database
        run: pnpm db:migrate

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # bitnami's image (not the official minio/minio one docker-compose.yml
      # uses locally) because GitHub Actions service containers can't
      # override a container's command/entrypoint — bitnami's image runs
      # `minio server` by default, official minio/minio does not. Matches
      # docker-compose.yml's creds/bucket so apps/api/src/env.ts's defaults
      # need no CI-specific overrides. See PROGRESS.md (M1.9 decisions).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: canvas
          MINIO_ROOT_PASSWORD: canvas12345
          MINIO_DEFAULT_BUCKETS: canvas-dev
        ports:
          - 9000:9000

    env:
      DATABASE_URL: postgres://canvas:canvas@localhost:5432/canvas

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - name: Wait for MinIO
        run: until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      - run: pnpm --filter @canvas/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @canvas/e2e test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
